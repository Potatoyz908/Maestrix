[pytest]
# Open Maestri pytest configuration
# Specifies test discovery, markers, and output options

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services)
    e2e: End-to-end visual and interaction tests under Xvfb
    performance: Performance/benchmark tests
    slow: Slow tests (>1s execution time)
    linux: Linux-specific tests
    requires_gtk: Tests requiring GTK3/WebKit2 libraries
    requires_network: Tests requiring network connectivity
    requires_build: Tests requiring compiled binaries
    smoke: Quick smoke tests for basic functionality

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=scripts --cov=maestri_core --cov-report=html --cov-report=term-missing

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Minimum Python version
minversion = 6.0
